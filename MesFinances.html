<script>
// ═══════════════════════════════════════════
// SUPABASE CONFIG
// ═══════════════════════════════════════════
const SUPA_URL="https://bphvxxfoyopnqeuoecmu.supabase.co";
const SUPA_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJwaHZ4eGZveW9wbnFldW9lY211Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3NDMwMTcsImV4cCI6MjA5NjMxOTAxN30.npK3KoL61fMK7Zn7rzO3jEkJQAjAmzlf8_mmjgluOF4";
const COLORS=["#6366f1","#f59e0b","#10b981","#ef4444","#3b82f6","#8b5cf6","#ec4899","#14b8a6"];

// Supabase helper → défini dans la section Auth ci-dessous

let DB={};
let _id=500;
const uid=()=>++_id;
let _loading=false;
let _loadingPromise=null;

function freshDefault(){
  return {appTitle:"💰 Mes Finances",banques:[],beneficiaires:[],natures:[],moyens:[],codes:[],transactions:[],budgets:{},recurrents:[]};
}

// ── Load all records with pagination (any table) ──
async function loadAllPages(table,order){
  let all=[];let from=0;const pageSize=1000;
  let maxPages=20;
  while(maxPages-->0){
    const page=await supa('GET',table,'',`order=${order}&limit=${pageSize}&offset=${from}`);
    if(!page||page.length===0)break;
    all=[...all,...page];
    if(page.length<pageSize)break;
    from+=pageSize;
  }
  return all;
}

// ── Load all transactions with pagination ──
async function loadAllTransactions(){
  let all=[];
  let from=0;
  const pageSize=1000;
  let maxPages=50; // safety limit
  while(maxPages-->0){
    const page=await supa('GET','transactions','',`order=id.desc&limit=${pageSize}&offset=${from}`);
    if(!page||page.length===0)break;
    all=[...all,...page];
    if(page.length<pageSize)break;
    from+=pageSize;
  }
  console.log(`Loaded ${all.length} transactions in ${Math.ceil(all.length/pageSize)} pages`);
  return all;
}

// ── Map Supabase rows to DB format ──
function mapTx(r){return{id:r.id,date:r.date,bId:r.beneficiaire_id,nId:r.nature_id,bqId:r.banque_id,mId:r.moyen_id,cId:r.code_id,debit:+(r.debit||0),credit:+(r.credit||0),ok:r.verifie||false};}
function mapBq(r){return{id:r.id,nom:r.nom,soldeInit:+(r.solde_init||0)};}
function mapBenef(r){return{id:r.id,nom:r.nom};}
function mapNature(r){return{id:r.id,l:r.libelle};}
function mapMoyen(r){return{id:r.id,l:r.libelle};}
function mapCode(r){return{id:r.id,code:r.code,l:r.libelle,budgetMensuel:+(r.budget_mensuel||0)};}
function mapRec(r){return{id:r.id,nom:r.nom,freq:r.freq,jour:r.jour,dateFixe:r.date_fixe,bId:r.beneficiaire_id,nId:r.nature_id,bqId:r.banque_id,mId:r.moyen_id,cId:r.code_id,debit:+(r.debit||0),credit:+(r.credit||0),actif:r.actif,derniereIntegration:r.derniere_integration||null};}

// ── Load all data from Supabase ──
async function loadDB(){
  // Prevent concurrent loads
  if(_loadingPromise){
    try{await _loadingPromise;}catch(e){}
    return;
  }
  try{
    _loadingPromise=_doLoadDB();
    await _loadingPromise;
  }catch(e){
    console.error("loadDB error:",e);
  }finally{
    _loadingPromise=null;
  }
}

// ── Supabase REST API (with auth token) ──
async function supa(method,table,body,params){
  params=params||"";body=body||null;
  if(!currentUser)throw new Error("Non connecté");
  // Auto-inject user_id on INSERT (single or batch)
  if(method==='POST'&&body){
    if(Array.isArray(body)){
      body=body.map(row=>({...row,user_id:currentUser.id}));
    }else if(typeof body==='object'){
      body={...body,user_id:currentUser.id};
    }
  }
  const url=`https://bphvxxfoyopnqeuoecmu.supabase.co/rest/v1/${table}${params?'?'+params:''}`;
  const isBatch=method==='POST'&&Array.isArray(body);
  const prefer=method==='POST'?(isBatch?'return=minimal':'return=representation'):'';
  const opts={method,headers:{
    'apikey':SUPA_KEY,
    'Authorization':'Bearer '+currentUser.token,
    'Content-Type':'application/json',
    ...(prefer?{'Prefer':prefer}:{})
  }};
  if(body)opts.body=JSON.stringify(body);
  const r=await fetch(url,opts);
  if(r.status===401){authLogout();throw new Error("Session expirée");}
  if(!r.ok){const e=await r.text();throw new Error(table+' '+method+': '+e);}
  if(method==='DELETE'||r.status===204)return null;
  const txt=await r.text();
  if(!txt)return null;
  try{return JSON.parse(txt);}catch(e){return null;}
}

async function _doLoadDB(){
  showLoading(true);
  try{
    const [bqs,benefs,nats,moys,cds,txs,recs,cfg]=await Promise.all([
      loadAllPages('banques','nom.asc'),
      loadAllPages('beneficiaires','nom.asc'),
      loadAllPages('natures','libelle.asc'),
      loadAllPages('moyens','libelle.asc'),
      loadAllPages('codes','libelle.asc'),
      loadAllTransactions(),
      loadAllPages('recurrents','nom.asc'),
      supa('GET','config','','select=cle,valeur'),
    ]);
    DB.banques=bqs.map(mapBq);
    DB.beneficiaires=benefs.map(mapBenef);
    DB.natures=nats.map(mapNature);
    DB.moyens=moys.map(mapMoyen);
    DB.codes=cds.map(mapCode);
    // Deduplicate transactions by id
    const txMap=new Map();
    txs.forEach(t=>{txMap.set(t.id,t);});
    DB.transactions=[...txMap.values()].map(mapTx);
    DB.recurrents=recs.map(mapRec);
    // budgets from codes
    DB.budgets={};
    DB.codes.forEach(c=>{DB.budgets[c.id]=c.budgetMensuel||0;});
    // config
    const titleRow=cfg.find(c=>c.cle==='appTitle');
    DB.appTitle=titleRow?titleRow.valeur:"💰 Mes Finances";
    updateHeader();
  }catch(e){
    console.error("Erreur chargement:",e);
    if(e.message==="Non connecté"){
      // Session expired - redirect to login
      authLogout();
    } else {
      showToast("Erreur de connexion Supabase: "+e.message,true);
    }
  }finally{showLoading(false);}
}  // end _doLoadDB

function updateHeader(){
  document.getElementById("hdr-count").textContent=DB.transactions.length;
  document.getElementById("app-title").textContent=DB.appTitle||"💰 Mes Finances";
  document.title=DB.appTitle||"💰 Mes Finances";
}

const fmt=n=>(n||0).toLocaleString("fr-FR",{minimumFractionDigits:2});
const today=()=>new Date().toISOString().split("T")[0];
const esc=s=>String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

const getLabel=item=>item?(item.nom||item.l||""):"—";
const sortAlpha=(arr,field)=>[...arr].sort((a,b)=>(a[field]||"").localeCompare(b[field]||"","fr"));

function addDays(ds,days){const d=new Date(ds);d.setDate(d.getDate()+days);return d.toISOString().split("T")[0];}

function showToast(msg,err=false){

// Renders a searchable dropdown. onSelect(id, label) called on pick.
// id='__new__' means user clicked "Nouveau..."
function renderSearchSelect(cfg){
  // cfg: {uid, items, field, selectedId, placeholder, allowNew}
  const id=cfg.uid;
  const selItem=cfg.selectedId?cfg.items.find(x=>x.id===+cfg.selectedId):null;
  const selLabel=selItem?getLabel(selItem):"";
  return `<div class="sel-wrap" id="swrap-${id}">
    <input type="text" class="sel-search" id="sinp-${id}"
      placeholder="${esc(cfg.placeholder||'— Chercher ou choisir —')}"
      value="${esc(selLabel)}"
      autocomplete="off"
      onfocus="openSelList('${id}')"
      oninput="filterSelList('${id}','${cfg.field||'nom'}')"
      onkeydown="selKeyDown(event,'${id}')"/>
    <input type="hidden" id="shid-${id}" value="${cfg.selectedId||''}"/>
    <div class="sel-list" id="slist-${id}" style="display:none"></div>
  </div>`;
}

function buildSelOptions(wid, field){
  const wrap=document.getElementById("swrap-"+wid);
  if(!wrap)return;
  const inp=document.getElementById("sinp-"+wid);
  const list=document.getElementById("slist-"+wid);
  const hid=document.getElementById("shid-"+wid);
  const q=(inp.value||"").toLowerCase().trim();
  const cfg=window._selCfg&&window._selCfg[wid];
  if(!cfg)return;
  const items=sortAlpha(cfg.items, cfg.field||"nom");
  const filtered=q?items.filter(x=>getLabel(x).toLowerCase().includes(q)):items;
  const curId=hid.value;
  let html="";
  if(cfg.allowNew!==false){
    html+=`<div class="sel-opt new-opt" onmousedown="selPickNew('${wid}')">✚ Nouveau…</div>`;
  }
  if(filtered.length===0&&q){
    html+=`<div class="sel-opt" style="color:#94a3b8;cursor:default">Aucun résultat</div>`;
  }
  filtered.forEach(x=>{
    const lbl=getLabel(x);
    const sel=x.id==curId?"selected-opt":"";
    html+=`<div class="sel-opt ${sel}" onmousedown="selPick('${wid}',${x.id},'${esc(lbl)}')">${esc(lbl)}</div>`;
  });
  list.innerHTML=html;
}

function openSelList(wid){
  // Close all others
  document.querySelectorAll(".sel-list").forEach(l=>{if(l.id!=="slist-"+wid)l.style.display="none";});
  const list=document.getElementById("slist-"+wid);
  if(!list)return;
  buildSelOptions(wid);
  list.style.display="block";
}
function filterSelList(wid){
  buildSelOptions(wid);
  document.getElementById("slist-"+wid).style.display="block";
  document.getElementById("shid-"+wid).value=""; // clear selection while typing
}
function selPick(wid,id,label){
  document.getElementById("sinp-"+wid).value=label;
  document.getElementById("shid-"+wid).value=id;
  document.getElementById("slist-"+wid).style.display="none";
  const cfg=window._selCfg&&window._selCfg[wid];
  if(cfg&&cfg.onSelect)cfg.onSelect(id,label);
}
function selPickNew(wid){
  document.getElementById("slist-"+wid).style.display="none";
  const cfg=window._selCfg&&window._selCfg[wid];
  if(cfg&&cfg.onNew)cfg.onNew();
}
function selKeyDown(e,wid){
  if(e.key==="Escape"){document.getElementById("slist-"+wid).style.display="none";}
}
function selGetValue(wid){return document.getElementById("shid-"+wid)?.value||"";}

// Close dropdowns on outside click
document.addEventListener("click",function(e){
  if(!e.target.closest(".sel-wrap")){
    document.querySelectorAll(".sel-list").forEach(l=>l.style.display="none");
  }
});

function initSel(wid,cfg){
  if(!window._selCfg)window._selCfg={};
  window._selCfg[wid]=cfg;
}

function renderDashboard(){
  // Guard: DB not loaded yet
  if(!DB||!DB.transactions){return '<p style="text-align:center;padding:40px;color:#94a3b8">⏳ Chargement…</p>';}
  const allTxs=DB.transactions||[];
  // Filter by selected banks (multi)
  const selectedIds=dashBanquesSelected.size>0?[...dashBanquesSelected].map(Number):null;
  const txs=selectedIds?allTxs.filter(t=>selectedIds.includes(+t.bqId)):allTxs;
  const banquesScope=selectedIds?(DB.banques||[]).filter(b=>selectedIds.includes(+b.id)):(DB.banques||[]);
  const totalD=txs.reduce((s,t)=>s+(+t.debit),0);
  const totalC=txs.reduce((s,t)=>s+(+t.credit),0);
  const solde=banquesScope.reduce((s,b)=>{
    const txB=allTxs.filter(t=>+t.bqId===+b.id);
    return s+(b.soldeInit||0)+txB.reduce((ss,t)=>ss+(+t.credit)-(+t.debit),0);
  },0);
  const soldeVerifTotal=banquesScope.reduce((s,b)=>{
    const txB=allTxs.filter(t=>+t.bqId===+b.id);
    return s+(b.soldeInit||0)+txB.filter(t=>t.ok).reduce((ss,t)=>ss+(+t.credit)-(+t.debit),0);
  },0);

  // ── Alertes récurrents ──
  const alertes=getAlertesRecurrents();
  const alertesHTML=alertes.length===0?"":
    `<div style="margin-bottom:16px">
      <div style="font-size:13px;font-weight:600;margin-bottom:8px;color:#92400e">⚠️ Échéances dans les 15 jours</div>
      ${alertes.map(a=>`<div class="alerte-card ${a.jours<0?'alerte-urgent':a.jours<=3?'alerte-urgent':''}">
        <div style="font-size:20px">${a.jours<0?"🔴":a.jours<=3?"🟠":"🟡"}</div>
        <div style="flex:1">
          <div style="font-size:13px;font-weight:600">${esc(a.rec.nom)}</div>
          <div style="font-size:11px;color:#94a3b8">
            ${a.rec.debit>0?'-'+fmt(a.rec.debit):'+'+fmt(a.rec.credit)} € • ${a.dateProchaine} • 
            ${a.jours<0?`<span style="color:#dc2626;font-weight:600">en retard de ${Math.abs(a.jours)}j</span>`:
              a.jours===0?`<span style="color:#f59e0b;font-weight:600">aujourd'hui !</span>`:
              `dans ${a.jours}j`}
          </div>
        </div>
        <button class="btn btn-green btn-xs" onclick="integrerRecurrent(${a.rec.id},'${a.dateProchaine}')">Intégrer</button>
      </div>`).join("")}
    </div>`;

  // ── Sélecteur banques (multi) ──
  const banqueSelHTML=`<div class="card card-p" style="margin-bottom:12px">
    <div style="font-size:12px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">Banque / Périmètre</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px">
      <button class="btn btn-xs ${dashBanquesSelected.size===0?'btn-primary':'btn-ghost'}"
        onclick="dashBanquesSelected=new Set();dashBanqueFilter='';render()">🏦 Toutes</button>
      ${sortAlpha(DB.banques,"nom").map(b=>{
        const sel=dashBanquesSelected.has(String(b.id));
        return `<button class="btn btn-xs ${sel?'btn-primary':'btn-ghost'}"
          onclick="toggleDashBanque('${b.id}')">${esc(b.nom)}</button>`;
      }).join("")}
    </div>
    ${dashBanquesSelected.size>0?`<p style="font-size:11px;color:#6366f1">${dashBanquesSelected.size} banque${dashBanquesSelected.size>1?'s':''} sélectionnée${dashBanquesSelected.size>1?'s':''}</p>`:''}
  </div>`;

  // ── KPI Solde ──
  const kpiHTML=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px">
    <div class="kpi ${solde>=0?'green':'red'}">
      <div class="kpi-label">Solde global</div>
      <div class="kpi-value ${solde>=0?'text-green':'text-red'}">${fmt(solde)} €</div>
    </div>
    <div class="kpi green">
      <div class="kpi-label">Solde vérifié</div>
      <div class="kpi-value text-green">${fmt(soldeVerifTotal)} €</div>
    </div>
  </div>`;

  // ── Tableau croisé Années × Budgets ──
  const currentYear=new Date().getFullYear();
  const years=[currentYear,currentYear-1,currentYear-2,currentYear-3,currentYear-4];
  const codesAlpha=sortAlpha(DB.codes,"l");

  // Compute net per code per year (using filtered txs by bank)
  const matrix={};
  const yearTotals={};
  years.forEach(y=>{
    yearTotals[y]=0;
    codesAlpha.forEach(c=>{
      const net=txs.filter(t=>+t.cId===+c.id&&t.date.startsWith(String(y)))
                   .reduce((s,t)=>s+(+t.debit)-(+t.credit),0);
      if(!matrix[c.id])matrix[c.id]={};
      matrix[c.id][y]=net>0?net:0;
      yearTotals[y]+=net>0?net:0;
    });
  });

  // Build table
  const thStyle="font-size:11px;font-weight:700;color:#64748b;padding:6px 8px;text-align:right;white-space:nowrap;border-bottom:2px solid #e2e8f0;";
  const tdStyle="font-size:12px;padding:5px 8px;text-align:right;border-bottom:1px solid #f1f5f9;";
  const tdLStyle="font-size:12px;padding:5px 8px;font-weight:600;border-bottom:1px solid #f1f5f9;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;";

  const headerRow=`<tr>
    <th style="${thStyle}text-align:left">Budget</th>
    ${years.map(y=>`<th style="${thStyle}">${y}</th>`).join("")}
  </tr>`;

  const dataRows=codesAlpha.map(c=>{
    const hasData=years.some(y=>(matrix[c.id]?.[y]||0)>0);
    if(!hasData)return "";
    const cells=years.map(y=>{
      const v=matrix[c.id]?.[y]||0;
      const pct=yearTotals[y]>0?Math.round(v/yearTotals[y]*100):0;
      const bg=pct>=30?"#fee2e2":pct>=15?"#fef3c7":pct>=5?"#f0fdf4":"";
      return `<td style="${tdStyle}background:${bg}">${v>0?`<span style="font-weight:600">${pct}%</span><br><span style="font-size:10px;color:#94a3b8">${fmt(v)}</span>`:'<span style="color:#e2e8f0">—</span>'}</td>`;
    }).join("");
    return `<tr><td style="${tdLStyle}" title="${esc(c.l)}">${esc(c.code)}<br><span style="font-size:10px;color:#94a3b8;font-weight:400">${esc(c.l)}</span></td>${cells}</tr>`;
  }).filter(r=>r).join("");

  const totalRow=`<tr style="background:#f8fafc">
    <td style="${tdLStyle}font-weight:700">TOTAL</td>
    ${years.map(y=>`<td style="${tdStyle}font-weight:700">${fmt(yearTotals[y])} €</td>`).join("")}
  </tr>`;

  const crossTable=`<div class="card card-p" style="margin-bottom:16px;overflow-x:auto">
    <div style="font-size:13px;font-weight:600;margin-bottom:10px">📊 Dépenses par budget et par année</div>
    <p style="font-size:10px;color:#94a3b8;margin-bottom:8px">% = part du budget dans le total annuel des dépenses • montant en dessous</p>
    <table style="width:100%;border-collapse:collapse;min-width:400px">
      <thead>${headerRow}</thead>
      <tbody>${dataRows}${totalRow}</tbody>
    </table>
  </div>`;

  // ── Solde par banque ──
  const bqRows=banquesScope.map(b=>{
    const txB=allTxs.filter(t=>+t.bqId===+b.id);
    const st=(b.soldeInit||0)+txB.reduce((s,t)=>s+(+t.credit)-(+t.debit),0);
    const sv=(b.soldeInit||0)+txB.filter(t=>t.ok).reduce((s,t)=>s+(+t.credit)-(+t.debit),0);
    return `<div style="padding:8px 0;border-bottom:1px solid #f8fafc">
      <div style="display:flex;justify-content:space-between">
        <span style="font-size:13px;font-weight:600">${esc(b.nom)}</span>
        <span style="font-size:13px;font-weight:700;color:${st>=0?'#059669':'#dc2626'}">${fmt(st)} €</span>
      </div>
      <div style="display:flex;justify-content:space-between;margin-top:2px">
        <span style="font-size:11px;color:#94a3b8">✅ Vérifié (${txB.filter(t=>t.ok).length} op.)</span>
        <span style="font-size:11px;font-weight:600;color:#059669">${fmt(sv)} €</span>
      </div>
    </div>`;
  }).join("");

  const bqCard=`<div class="card card-p">
    <div style="font-size:13px;font-weight:600;margin-bottom:4px">🏦 Solde par banque</div>
    <p style="font-size:10px;color:#94a3b8;margin-bottom:8px">Total = solde initial + toutes opérations &nbsp;|&nbsp; Vérifié = solde initial + cochées</p>
    ${bqRows||'<p style="color:#94a3b8;font-size:13px">Aucune banque</p>'}
  </div>`;

  return alertesHTML+banqueSelHTML+kpiHTML+crossTable+bqCard;
}

let txSearch="",txFBq="",txFCode="",txFMois="",txShowF=false,txShowVerif="all";
let recFBqFilter=""; // filtre banque propre aux récurrents
let txPMode="mois"; // "mois" | "annee" | "periode" | "tous"
let txPAnnee=new Date().getFullYear().toString();
let txPDebut=""; let txPFin="";
let txSelected=new Set();
let txSelectMode=false;

function txSearchInput(val){

function renderTransactions(){
  if(!DB||!DB.transactions)return '<p style="text-align:center;padding:40px;color:#94a3b8">⏳ Chargement…</p>';
  const moisList=[...new Set(DB.transactions.map(t=>t.date.slice(0,7)))].sort().reverse();
  let txs=DB.transactions.filter(t=>{
    const b=find(DB.beneficiaires,t.bId),n=find(DB.natures,t.nId);
    const txt=[b?.nom,n?.l].filter(Boolean).join(" ").toLowerCase();
    if(txSearch&&!txt.includes(txSearch.toLowerCase()))return false;
    if(txFBq&&t.bqId!==+txFBq)return false;
    if(txFCode&&+t.cId!==+txFCode)return false;
    if(txShowVerif==="yes"&&!t.ok)return false;
    if(txShowVerif==="no"&&t.ok)return false;
    // Période
    const d=t.date;
    if(txPMode==="mois"&&txFMois&&!d.startsWith(txFMois))return false;
    if(txPMode==="annee"&&txPAnnee&&!d.startsWith(txPAnnee))return false;
    if(txPMode==="periode"){
      if(txPDebut&&d<txPDebut)return false;
      if(txPFin&&d>txPFin)return false;
    }
    return true;
  }).sort((a,b)=>b.date.localeCompare(a.date));

  const anneeList=[...new Set(DB.transactions.map(t=>t.date.slice(0,4)))].sort().reverse();

  const filterBar=txShowF?`<div class="card card-p" style="margin-bottom:10px">

    <div style="font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">Période</div>

      <button class="btn btn-xs ${txPMode==='mois'?'btn-primary':'btn-ghost'}" onclick="txPMode='mois';render()">Par mois</button>
      <button class="btn btn-xs ${txPMode==='annee'?'btn-primary':'btn-ghost'}" onclick="txPMode='annee';render()">Par année</button>
      <button class="btn btn-xs ${txPMode==='periode'?'btn-primary':'btn-ghost'}" onclick="txPMode='periode';render()">Période libre</button>
    </div>
    ${txPMode==='mois'?`<div class="form-group" style="margin-bottom:10px"><label>Mois</label>
      <select onchange="txFMois=this.value;render()">
        <option value="">Tous les mois</option>
        ${moisList.map(m=>`<option value="${m}" ${txFMois===m?"selected":""}>${m}</option>`).join("")}
      </select></div>`:''}
    ${txPMode==='annee'?`<div class="form-group" style="margin-bottom:10px"><label>Année</label>
      <select onchange="txPAnnee=this.value;render()">
        ${anneeList.map(a=>`<option value="${a}" ${txPAnnee===a?"selected":""}>${a}</option>`).join("")}
      </select></div>`:''}
    ${txPMode==='periode'?`<div class="grid2" style="margin-bottom:10px">
      <div class="form-group" style="margin:0"><label>Du</label>
        <input type="date" value="${txPDebut}" onchange="txPDebut=this.value;render()"/></div>
      <div class="form-group" style="margin:0"><label>Au</label>
        <input type="date" value="${txPFin}" onchange="txPFin=this.value;render()"/></div>
    </div>`:''}

// RÉCURRENTS
// ═══════════════════════════════════════════
function getAlertesRecurrents(){
  const alertes=[];const t0=today();
  DB.recurrents.filter(r=>r.actif).forEach(r=>{
    const dp=prochaineDateRecurrent(r);if(!dp)return;
    const j=diffDays(t0,dp);
    // Afficher de J-7 (dépassé) à J+15 (à venir)
    if(j>=-7&&j<=15)alertes.push({rec:r,dateProchaine:dp,jours:j});
  });
  return alertes.sort((a,b)=>a.jours-b.jours);
}
function dernierJourDuMois(an,mois){
  return new Date(an, mois, 0).getDate(); // mois=1-12, new Date(an,mois,0) = last day
}
function jourEffectif(jour,an,mois){
  // jour=99 means last day of month
  if(jour===99) return dernierJourDuMois(an,mois);
  // cap at last day of month (e.g. jour=31 in June -> 30)
  return Math.min(jour, dernierJourDuMois(an,mois));
}
function buildDateMensuel(an,mois,jour){
  const j=jourEffectif(jour,an,mois);
  return `${an}-${String(mois).padStart(2,'0')}-${String(j).padStart(2,'0')}`;
}
function prochaineDateRecurrent(r){
  const t0=today();
  const now=new Date();
  const an=now.getFullYear();
  const mois=now.getMonth()+1;
  if(["mensuel","bimestriel","trimestriel","semestriel"].includes(r.freq)){
    const j=r.jour||1;
    const intervalMois={mensuel:1,bimestriel:2,trimestriel:3,semestriel:6}[r.freq]||1;
    const dernier=r.derniereIntegration||r.derniere_integration||null;
    // Calculer la prochaine date après la dernière intégration
    if(dernier){
      const d=new Date(dernier+'-01');
      d.setMonth(d.getMonth()+intervalMois);
      const an1=d.getFullYear();
      const m1=d.getMonth()+1;
      const next=buildDateMensuel(an1,m1,j);
      if(next>=t0)return next;
      // Si dépassée, continuer à avancer
      let dd=new Date(next+'-01')||new Date();
      while(true){
        dd.setMonth(dd.getMonth()+intervalMois);
        const candidate=buildDateMensuel(dd.getFullYear(),dd.getMonth()+1,j);
        if(candidate>=t0)return candidate;
        if(dd.getFullYear()>an+2)break;
      }
    }
    // Pas de dernière intégration - trouver la prochaine occurrence
    let searchMois=mois;let searchAn=an;
    for(let i=0;i<12;i++){
      const candidate=buildDateMensuel(searchAn,searchMois,j);
      if(candidate>=t0)return candidate;
      searchMois+=intervalMois;
      while(searchMois>12){searchMois-=12;searchAn++;}
    }
    return buildDateMensuel(an,mois,j);
  }
  if(r.freq==="annuel"){
    const d1=`${an}-${r.dateFixe.slice(5)}`;
    const d2=`${an+1}-${r.dateFixe.slice(5)}`;
    return d1>=t0?d1:d2;
  }
  if(r.freq==="unique"){return r.dateFixe>=t0?r.dateFixe:null;}
  return null;
}
function renderRecurrents(){
  if(!DB||!DB.recurrents)return '<p style="text-align:center;padding:40px;color:#94a3b8">⏳ Chargement…</p>';
  const alertes=getAlertesRecurrents();
  const nbRetard=alertes.filter(a=>a.jours<0).length;
  const nbAVenir=alertes.filter(a=>a.jours>=0).length;
  const bannerMsg=nbRetard>0?
    `🔴 ${nbRetard} échéance${nbRetard>1?'s':''} en retard${nbAVenir>0?' + '+nbAVenir+' à venir':''}`:
    `⚠️ ${nbAVenir} échéance${nbAVenir>1?'s':''} dans les 15 prochains jours`;
  const banner=alertes.length>0?`<div style="background:#fef2f2;border:1px solid #fca5a5;border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:12px;font-weight:600;color:#dc2626">${bannerMsg}</div>`:"";

  // Filtre banque indépendant pour les récurrents
  const recFBq=recFBqFilter;
  const bqNom=recFBq?find(DB.banques,recFBq)?.nom:"";
  const filtreBar=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
    <div class="form-group" style="margin:0;flex:1"><label>Filtrer par banque</label>
      <select onchange="recFBqFilter=this.value;render()">
        <option value="">Toutes les banques</option>
        ${sortAlpha(DB.banques,"nom").map(b=>`<option value="${b.id}" ${recFBq==b.id?"selected":""}>${esc(b.nom)}</option>`).join("")}
      </select>
    </div>
  </div>`;

  const recsAll=recFBq?DB.recurrents.filter(r=>+r.bqId===+recFBq):DB.recurrents;
  // Trier par prochaine échéance croissante
  const recsFiltered=[...recsAll].sort((a,b)=>{
    const da=prochaineDateRecurrent(a)||"9999";
    const db=prochaineDateRecurrent(b)||"9999";
    return da.localeCompare(db);
  });
  const rows=recsFiltered.map(r=>{
    const benef=find(DB.beneficiaires,r.bId);const bq=find(DB.banques,r.bqId);const code=find(DB.codes,r.cId);
    const dp=prochaineDateRecurrent(r);
    const fl={mensuel:"Mensuel",bimestriel:"Bimestriel",trimestriel:"Trimestriel",semestriel:"Semestriel",annuel:"Annuel",unique:"Date fixe"}[r.freq]||r.freq;
    const jourLabel=r.freq==="mensuel"?(r.jour===99?"fin de mois":"le "+r.jour):"";;
    return `<div class="card card-p" style="margin-bottom:10px;opacity:${r.actif?1:.5}">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
        <div><span style="font-size:13px;font-weight:600">${esc(r.nom)}</span>
          <span class="badge badge-orange" style="margin-left:6px">${fl}${jourLabel?" · "+jourLabel:""}</span>
          ${r.actif?'<span class="badge badge-green" style="margin-left:4px">Actif</span>':'<span class="badge" style="margin-left:4px;background:#f1f5f9;color:#64748b">Inactif</span>'}
        </div>
        <span style="font-size:13px;font-weight:700;color:${r.credit>0?'#059669':'#dc2626'}">${r.credit>0?'+':'-'}${fmt(r.credit>0?r.credit:r.debit)} €</span>
      </div>
      <div style="font-size:11px;color:#94a3b8;margin-bottom:8px">
        ${benef?esc(benef.nom):"—"} ${bq?"• "+esc(bq.nom):""} ${code?"• "+esc(code.code):""}
        ${dp?`• Prochaine : <strong style="color:#1e293b">${dp}</strong>`:""}
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn btn-ghost btn-xs" onclick="toggleActifRecurrent(${r.id})">${r.actif?"⏸ Désactiver":"▶ Activer"}</button>
        <button class="btn btn-ghost btn-xs" onclick="editRecurrent(${r.id})">✏️ Modifier</button>
        <button class="btn btn-ghost btn-xs" onclick="duplicateRecurrent(${r.id})">📋 Dupliquer</button>
        ${dp?`<button class="btn btn-green btn-xs" onclick="integrerRecurrent(${r.id},'${dp}')">✅ Intégrer</button>`:""}
        <button class="btn btn-danger btn-xs" onclick="deleteRecurrent(${r.id})">🗑️</button>
      </div>
    </div>`;
  }).join("")||'<p style="text-align:center;color:#94a3b8;padding:24px 0;font-size:13px">Aucune opération récurrente</p>';
  return `
    <div style="position:sticky;top:0;z-index:20;background:#f1f5f9;padding:10px 0 6px;margin:-16px -14px 10px;padding-left:14px;padding-right:14px;box-shadow:0 2px 8px rgba(0,0,0,.06);">
      ${banner}

let budgetMois=today().slice(0,7);
let budgetMode="mois"; // "mois" | "periode" | "annee"
let budgetDebut=""; let budgetFin=""; let budgetAnnee=new Date().getFullYear().toString();
let budgetBanque=""; // "" = toutes
function budgetDateFilter(t){
  // Filter by bank
  if(budgetBanque&&+t.bqId!==+budgetBanque)return false;
  // Filter by date
  const d=t.date;
  if(budgetMode==="mois") return d.startsWith(budgetMois);
  if(budgetMode==="annee") return d.startsWith(budgetAnnee);
  if(budgetMode==="periode"){
    if(budgetDebut&&d<budgetDebut)return false;
    if(budgetFin&&d>budgetFin)return false;
    return true;
  }
  return false;
}
function budgetTxFilter(t){
  if(+t.debit<=0)return false;
  return budgetDateFilter(t);
}

function budgetPeriodeLabel(){
  if(budgetMode==="mois") return budgetMois;
  if(budgetMode==="annee") return "Année "+budgetAnnee;
  if(budgetMode==="periode") return (budgetDebut||"…")+" → "+(budgetFin||"…");
  return "";
}

function renderBudget(){
  if(!DB||!DB.transactions)return '<p style="text-align:center;padding:40px;color:#94a3b8">⏳ Chargement…</p>';
  const moisList=[...new Set(DB.transactions.map(t=>t.date.slice(0,7)))].sort().reverse();
  const anneeList=[...new Set(DB.transactions.map(t=>t.date.slice(0,4)))].sort().reverse();
  if(moisList.length&&!moisList.includes(budgetMois))budgetMois=moisList[0];

  // Période selector
  const periodeSel=`
    <div class="card card-p" style="margin-bottom:14px">
      <div style="font-size:12px;font-weight:700;color:#64748b;margin-bottom:10px;text-transform:uppercase;letter-spacing:.05em">Période d'analyse</div>
      <div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap">
        <button class="btn btn-sm ${budgetMode==='mois'?'btn-primary':'btn-ghost'}" onclick="budgetMode='mois';render()">Par mois</button>
        <button class="btn btn-sm ${budgetMode==='annee'?'btn-primary':'btn-ghost'}" onclick="budgetMode='annee';render()">Par année</button>
        <button class="btn btn-sm ${budgetMode==='periode'?'btn-primary':'btn-ghost'}" onclick="budgetMode='periode';render()">Période libre</button>
      </div>
      ${budgetMode==='mois'?`
        <div class="form-group" style="margin:0"><label>Mois</label>
          <select onchange="budgetMois=this.value;render()">
            ${moisList.map(m=>`<option value="${m}" ${budgetMois===m?"selected":""}>${m}</option>`).join("")}
            ${!moisList.length?`<option value="${budgetMois}">${budgetMois}</option>`:""}
          </select></div>`:""}
      ${budgetMode==='annee'?`
        <div class="form-group" style="margin:0"><label>Année</label>
          <select onchange="budgetAnnee=this.value;render()">
            ${anneeList.map(a=>`<option value="${a}" ${budgetAnnee===a?"selected":""}>${a}</option>`).join("")}
            ${!anneeList.length?`<option value="${budgetAnnee}">${budgetAnnee}</option>`:""}
          </select></div>`:""}
      ${budgetMode==='periode'?`
        <div class="grid2">
          <div class="form-group" style="margin:0"><label>Du</label>
            <input type="date" value="${budgetDebut}" onchange="budgetDebut=this.value;render()"/></div>
          <div class="form-group" style="margin:0"><label>Au</label>
            <input type="date" value="${budgetFin}" onchange="budgetFin=this.value;render()"/></div>
        </div>`:""}
    <div style="border-top:1px solid #f1f5f9;padding-top:10px;margin-top:4px">
      <div class="form-group" style="margin:0"><label>Banque</label>
        <select onchange="budgetBanque=this.value;render()">
          <option value="">&#127974; Toutes les banques</option>
          ${sortAlpha(DB.banques,"nom").map(b=>`<option value="${b.id}" ${budgetBanque==b.id?"selected":""}>${esc(b.nom)}</option>`).join("")}
        </select>
      </div>
    </div>
    </div>`;

  // Totaux période
  const txPeriode=DB.transactions.filter(budgetDateFilter);
  const totalPeriode=txPeriode.reduce((s,t)=>s+(+t.debit)-(+t.credit),0);
  const nbTx=txPeriode.length;

  const rows=sortAlpha(DB.codes,"l").map(c=>{
    // Net = débits - crédits (remboursements déduits)
    const txCode=DB.transactions.filter(t=>+t.cId===+c.id&&budgetDateFilter(t));
    const dep=txCode.reduce((s,t)=>s+(+t.debit)-(+t.credit),0);
    if(dep<=0&&(DB.budgets[c.id]||0)===0)return ""; // masquer les codes vides sans budget
    const bgt=budgetMode==="mois"?(DB.budgets[c.id]||0):
              budgetMode==="annee"?(DB.budgets[c.id]||0)*12:
              (DB.budgets[c.id]||0); // période libre : budget mensuel affiché tel quel
    const pct=bgt>0?Math.min(dep/bgt*100,100):0;
    const cls=pct>=100?"prog-red":pct>=80?"prog-amber":"prog-green";
    const tag=dep>bgt&&bgt>0?`<span class="badge badge-red">Dépassé</span>`:
              pct>=80&&pct<100?`<span class="badge badge-amber">Attention</span>`:
              bgt>0?`<span class="badge badge-green">OK</span>`:"";
    const bgtLabel=budgetMode==="annee"?"Budget annuel (×12)":"Budget mensuel";
    return `<div class="card card-p" style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <span style="font-size:13px;font-weight:600">${esc(c.l)} <span class="badge badge-amber">${esc(c.code)}</span></span>
        <span style="font-size:13px;font-weight:700;color:${dep>bgt&&bgt>0?'#dc2626':dep<0?'#059669':'#1e293b'}">${fmt(dep)} ${bgt>0?"/ "+fmt(bgt):""} €${dep<0?' <span style="font-size:10px;color:#059669">(remb.)</span>':''}</span>
      </div>
      ${bgt>0?`<div class="prog-bg"><div class="prog-bar ${cls}" style="width:${pct}%"></div></div>`:""}
      <div style="display:flex;align-items:center;gap:8px;margin-top:6px">
        <span style="font-size:11px;color:#94a3b8">${bgtLabel} :</span>
        <input type="number" style="width:90px;font-size:12px;padding:4px 8px;border-radius:8px" value="${DB.budgets[c.id]||""}" min="0" step="10"
          onchange="saveBudget(${c.id},this.value)"/>
        <span style="font-size:11px;color:#94a3b8">€</span>${tag}
      </div>
    </div>`;
  }).filter(r=>r).join("")||'<p style="text-align:center;color:#94a3b8;padding:20px 0;font-size:13px">Aucune dépense sur cette période</p>';

  const totalBar=`<div class="card card-p" style="margin-bottom:12px;background:#f8fafc">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div>
        <div style="font-size:12px;color:#94a3b8;font-weight:600">Total dépenses — ${esc(budgetPeriodeLabel())}</div>
        <div style="font-size:18px;font-weight:700;color:#dc2626;margin-top:2px">${fmt(totalPeriode)} €</div>
      </div>
      <div style="text-align:right">
        <div style="font-size:11px;color:#94a3b8">${nbTx} opération${nbTx>1?'s':''}</div>
      </div>
    </div>
  </div>`;

  return periodeSel+totalBar+rows;
}

function renderRefTable(title,key,field){
  const q=(refSearch[key]||"").toLowerCase();
  const allItems=sortAlpha(DB[key],field);

function toggleMergeSel(key,id){
  if(!mergeSelected[key])mergeSelected[key]=new Set();
  if(mergeSelected[key].has(id))mergeSelected[key].delete(id);
  else mergeSelected[key].add(id);
  // Update only the clicked row without full render
  const row=document.getElementById("ref-row-"+key+"-"+id);
  const sel=mergeSelected[key].has(id);
  if(row){
    row.style.background=sel?"#eef2ff":"";
    row.style.borderRadius=sel?"8px":"";
    const box=row.querySelector(".sel-box");
    if(box){box.className="sel-box"+(sel?" on":"");box.textContent=sel?"✓":"";}
  }
  // Update the merge bar count and target select
  const card=document.getElementById("ref-table-"+key)?.closest(".card");
  if(card){
    const countEl=card.querySelector(".merge-count");
    if(countEl)countEl.textContent=mergeSelected[key].size+" sélectionné"+(mergeSelected[key].size>1?"s":"");
    // Show/hide fusion button
    const mergeBtn=card.querySelector(".merge-btn-confirm");
    if(mergeSelected[key].size>=2){
      if(!mergeBtn){
        // Re-render just the merge bar
        const mergeBarEl=card.querySelector(".merge-bar");
        if(mergeBarEl)renderMergeBar(key,mergeBarEl);
      }

}

async function doMerge(key,field){
  const sel=mergeSelected[key];
  if(!sel||sel.size<2){showToast("Sélectionnez au moins 2 éléments",true);return;}
  const targetId=+document.getElementById("merge-target-"+key)?.value;
  if(!targetId){showToast("Choisissez la cible",true);return;}
  const target=find(DB[key],targetId);
  if(!target){showToast("Cible introuvable",true);return;}
  const toDelete=[...sel].filter(id=>+id!==+targetId);
  const nbTx=DB.transactions.filter(t=>{
    const fk=key==='beneficiaires'?'bId':'nId';
    return toDelete.includes(+t[fk]);
  }).length;
  askConfirm(
    `Fusionner ${sel.size} éléments ?`,
    `${nbTx} transaction${nbTx>1?'s':''} seront rattachées à "${target[field]}". Les ${toDelete.length} doublon${toDelete.length>1?'s':''} seront supprimés.`,
    async function(){
      try{
        showLoading(true);
        const fkCol=key==='beneficiaires'?'beneficiaire_id':'nature_id';
        const fk=key==='beneficiaires'?'bId':'nId';
        // Update all transactions pointing to duplicates
        for(const dupId of toDelete){
          const txIds=DB.transactions.filter(t=>+t[fk]===+dupId).map(t=>t.id);
          if(txIds.length>0){
            await supa('PATCH','transactions',{[fkCol]:targetId},`${fkCol}=eq.${dupId}`);
          }
          // Delete the duplicate
          await supa('DELETE',key,'',`id=eq.${dupId}`);
        }
        mergeMode[key]=false;
        mergeSelected[key]=new Set();
        await loadDB();render();
        showToast(`Fusion terminée ✅ — ${toDelete.length} doublon${toDelete.length>1?'s':''} supprimé${toDelete.length>1?'s':''}`);
      }catch(e){showToast("Erreur: "+e.message,true);}
      finally{showLoading(false);}
    },
    "Fusionner","#6366f1"
  );
}

async function addRefItem(key,field){

  const tableMap={beneficiaires:'beneficiaires',natures:'natures',moyens:'moyens'};
  const fieldMap={nom:'nom',l:'libelle'};
  try{
    const row={};row[fieldMap[field]||field]=v;
    await supa('POST',tableMap[key]||key,row);

    await new Promise(r=>setTimeout(r,500)); // attendre Supabase
    await loadDB();

    showToast("Ajouté ✅");
  }catch(e){showToast("Erreur: "+e.message,true);}
}

async function supaPostAndGet(table,row,mapper){
  await supa('POST',table,row);
  // Fetch the just-created row
  const field=Object.keys(row)[0];
  const val=encodeURIComponent(row[field]);
  const res=await supa('GET',table,'',`${field}=eq.${val}&order=id.desc&limit=1`);
  return res&&res[0]?mapper(res[0]):null;
}

function doImportCSV(input){
  const file=input.files[0];if(!file)return;
  askImportMode(async function(mode){
    const r=new FileReader();
    r.onload=async e=>{
      try{
        const text=e.target.result;
        const lines=text.split(/\r?\n/).filter(l=>l.trim());
        if(lines.length<2){showToast("Fichier vide",true);return;}
        const sep=lines[0].includes(";")?";":lines[0].includes("\t")?"\t":",";
        const headers=lines[0].split(sep).map(h=>clean(h).toLowerCase()
          .replace(/[éèê]/g,"e").replace(/[àâ]/g,"a").replace(/[ùû]/g,"u").replace(/[îï]/g,"i").replace(/[ôö]/g,"o").replace(/ç/g,"c"));

        const iDate=findCol(headers,["date"]);
        const iBenef=findCol(headers,["beneficiaire","beneficiary","tiers","libelle"]);
        const iNature=findCol(headers,["nature","description","motif","categorie"]);
        // Prefer full "banque" column over short "bq"
        const iBanque=findCol(headers,["banque","bank","etablissement"]);
        const iBqShort=findCol(headers,["bq"]);
        const iBq=iBanque>=0?iBanque:iBqShort;
        const iMoyen=findCol(headers,["moyen","type","mode","instrument","paiement","reglement"]);
        const iDebit=findCol(headers,["debit"]);
        const iCredit=findCol(headers,["credit"]);
        const iCode=findCol(headers,["code","budget"]);
        
        // Debug: log detected columns
        console.log("Colonnes détectées:",{iDate,iBenef,iNature,iBq,iMoyen,iDebit,iCredit,iCode});
        console.log("En-têtes:",headers);

        if(mode==="replace"){
          showLoading(true);
          await supa('DELETE','transactions','','id=gt.0');
          await supa('DELETE','recurrents','','id=gt.0');
          await supa('DELETE','codes','','id=gt.0');
          await supa('DELETE','moyens','','id=gt.0');
          await supa('DELETE','natures','','id=gt.0');
          await supa('DELETE','beneficiaires','','id=gt.0');
          await supa('DELETE','banques','','id=gt.0');
          DB={banques:[],beneficiaires:[],natures:[],moyens:[],codes:[],
              transactions:[],budgets:{},recurrents:[],appTitle:DB.appTitle};
        } else {
          // Mode "Ajouter" : reload all ref tables from Supabase first to avoid duplicates
          showLoading(true);
          await loadDB();
        }

        let added=0,skipped=0,errors=[],txBatch=[];
        for(let i=1;i<lines.length;i++){
          if(!lines[i].trim()){skipped++;continue;}
          const cols=splitCSV(lines[i],sep);
          if(cols.length<2){skipped++;continue;}
          const rawDate=iDate>=0?clean(cols[iDate]||""):"";
          const date=parseDate(rawDate);
          if(!date){
            if(i<=3)errors.push(`Ligne ${i+1}: date invalide "${rawDate}"`);
            skipped++;continue;
          }
          const debit=parseFR(cols[iDebit]);
          const credit=parseFR(cols[iCredit]);
          const benefNom=clean(cols[iBenef]);
          const natureLib=clean(cols[iNature]);
          const bqNom=clean(cols[iBq]);
          const moyenLib=clean(cols[iMoyen]);
          const codeStr=clean(cols[iCode]);

          let benef=await supaFindOrCreate('beneficiaires','nom',benefNom,mapBenef);
          let nature=await supaFindOrCreate('natures','libelle',natureLib,mapNature);
          let bq=await supaFindOrCreateBq(bqNom);
          let moyen=await supaFindOrCreate('moyens','libelle',moyenLib,mapMoyen);
          let code=null;
          if(codeStr){
            // Check memory
            code=DB.codes.find(c=>c.code.toLowerCase()===codeStr.toLowerCase()||c.l.toLowerCase()===codeStr.toLowerCase());
            if(!code){
              // Check Supabase
              try{
                const exc=await supa('GET','codes','',`code=ilike.${encodeURIComponent(codeStr)}&limit=1`);
                if(exc&&exc.length>0){code=mapCode(exc[0]);DB.codes.push(code);}
                else{
                  const codeVal=codeStr.toUpperCase().slice(0,6);
                  await supa('POST','codes',{code:codeVal,libelle:codeStr,budget_mensuel:0});
                  const cr=await supa('GET','codes','',`code=eq.${encodeURIComponent(codeVal)}&order=id.desc&limit=1`);
                  if(cr&&cr.length>0){code=mapCode(cr[0]);DB.codes.push(code);}
                }
              }catch(e){}
            }
          }
          txBatch.push({date,beneficiaire_id:benef?.id||null,nature_id:nature?.id||null,banque_id:bq?.id||null,moyen_id:moyen?.id||null,code_id:code?.id||null,debit,credit,verifie:true});
          added++;
          // Insert in batches of 200
          if(txBatch.length>=200){
            try{await supa('POST','transactions',txBatch);}catch(e){skipped+=txBatch.length;added-=txBatch.length;}
            txBatch=[];
          }
        }
        // Flush remaining batch
        if(txBatch.length>0){
          try{await supa('POST','transactions',txBatch);}
          catch(e){skipped+=txBatch.length;added-=txBatch.length;}
        }
        await loadDB();render();
        const errMsg=errors.length>0?" — "+errors[0]:"";
        showToast(`${added} transactions importées${skipped>0?" ("+skipped+" ignorées"+errMsg+")":""}`,added===0);
      }catch(err){console.error(err);showToast("Erreur import : "+err.message,true);}
    };
    r.readAsText(file,"UTF-8");
    input.value="";
  });
}

function clean(v){return(v||"").replace(/"/g,"").trim();}

async function supaFindOrCreate(table,field,val,mapper){
  if(!val||!val.trim())return null;
  val=val.trim();
  const dbKey={beneficiaires:'beneficiaires',natures:'natures',moyens:'moyens',banques:'banques',codes:'codes'}[table]||table;
  const memField=field==='libelle'?'l':field; // map DB field name to memory field name
  // 1. Check in memory first
  let item=DB[dbKey]?.find(x=>{
    const v=x[memField]||x.nom||x.l||"";
    return v.toLowerCase()===val.toLowerCase();
  });
  if(item)return item;
  // 2. Check in Supabase (avoid duplicate on re-import)
  try{
    const existing=await supa('GET',table,'',`${field}=ilike.${encodeURIComponent(val)}&limit=1`);
    if(existing&&existing.length>0){
      item=mapper(existing[0]);
      if(!DB[dbKey])DB[dbKey]=[];
      DB[dbKey].push(item);
      return item;
    }
  }catch(e){}
  // 3. Create new
  try{
    const row={};row[field]=val;
    await supa('POST',table,row);
    const created=await supa('GET',table,'',`${field}=ilike.${encodeURIComponent(val)}&order=id.desc&limit=1`);
    if(created&&created.length>0){
      item=mapper(created[0]);
      if(!DB[dbKey])DB[dbKey]=[];
      DB[dbKey].push(item);
      return item;
    }
  }catch(e){console.error("supaFindOrCreate error:",table,field,val,e);}
  return null;
}

async function supaFindOrCreateBq(nom){
  if(!nom||!nom.trim())return DB.banques[0]||null;
  nom=nom.trim();
  // Check memory
  let b=DB.banques.find(x=>x.nom.toLowerCase()===nom.toLowerCase());
  if(b)return b;
  // Check Supabase
  try{
    const existing=await supa('GET','banques','',`nom=ilike.${encodeURIComponent(nom)}&limit=1`);
    if(existing&&existing.length>0){
      b=mapBq(existing[0]);DB.banques.push(b);return b;
    }
    // Create
    await supa('POST','banques',{nom,solde_init:0});
    const created=await supa('GET','banques','',`nom=ilike.${encodeURIComponent(nom)}&order=id.desc&limit=1`);
    if(created&&created.length>0){b=mapBq(created[0]);DB.banques.push(b);return b;}
  }catch(e){console.error("supaFindOrCreateBq:",e);}
  return DB.banques[0]||null;
}

function parseFR(v){
  // Handles Numbers export format: "50,00 €" "1 000,00 €" "75,50 €"
  if(!v)return 0;
  let s=String(v).replace(/"/g,"").trim();
  if(!s||s==="-")return 0;
  // Remove currency symbol and any non-numeric chars except , . - 
  s=s.replace(/[€$£\s]/g,"");   // remove € and spaces
  s=s.replace(/[^0-9,\.\-]/g,""); // remove anything else
  if(!s)return 0;
  // Now handle decimal: if comma present -> French decimal sep
  if(s.includes(",")){
    s=s.replace(/\./g,"");    // remove dot thousand sep
    s=s.replace(",",".");      // comma -> dot decimal
  }
  return parseFloat(s)||0;
}
function findOrCreate(arr,field,val){
  if(!val)return null;
  let item=arr.find(x=>(x[field]||"").toLowerCase()===val.toLowerCase());
  if(!item){item={id:uid()};item[field]=val;arr.push(item);}
  return item;
}
function findOrCreateBq(nom){
  if(!nom)return DB.banques[0]||null;
  let b=DB.banques.find(x=>x.nom.toLowerCase()===nom.toLowerCase());
  if(!b){b={id:uid(),nom,soldeInit:0};DB.banques.push(b);}
  return b;
}
function findCol(headers,names){
  for(const n of names){const i=headers.findIndex(h=>h.includes(n));if(i>=0)return i;}
  return -1;
}
function splitCSV(line,sep){
  const r=[];let cur="",inQ=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(c==='"'){inQ=!inQ;}else if(c===sep&&!inQ){r.push(cur);cur="";}else cur+=c;
  }
  r.push(cur);return r;
}
function parseDate(s){
  if(!s)return null;
  s=s.trim();
  // DD/MM/YYYY or DD-MM-YYYY or DD.MM.YYYY
  const m1=s.match(/^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{4})$/);
  if(m1)return`${m1[3]}-${m1[2].padStart(2,'0')}-${m1[1].padStart(2,'0')}`;
  // YYYY-MM-DD
  const m2=s.match(/^(\d{4})[\/\-\.](\d{2})[\/\-\.](\d{2})$/);
  if(m2)return`${m2[1]}-${m2[2]}-${m2[3]}`;
  // DD/MM/YY (2-digit year) -> assume 2000+
  const m3=s.match(/^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{2})$/);
  if(m3){const yr=+m3[3]>=50?`19${m3[3]}`:`20${m3[3]}`;return`${yr}-${m3[2].padStart(2,'0')}-${m3[1].padStart(2,'0')}`;}
  return null;
}

async function archiveTransactions(){
  const annee=document.getElementById("arch-annee-sel")?.value||"";
  const bqId=document.getElementById("arch-banque-sel")?.value||"";
  
  // Filter transactions to archive
  let toArchive=DB.transactions.filter(t=>{
    if(annee&&!t.date.startsWith(annee))return false;
    if(bqId&&+t.bqId!==+bqId)return false;
    return true;
  });
  
  if(toArchive.length===0){showToast("Aucune transaction correspondante",true);return;}
  
  const label=`${annee||"toutes années"}${bqId?" — "+find(DB.banques,bqId)?.nom:""}`;
  askConfirm(
    `Archiver ${toArchive.length} transaction${toArchive.length>1?'s':''} ?`,
    `Export CSV de "${label}" puis suppression. Le solde initial sera recalculé.`,
    async function(){
      // 1. Export CSV
      const bom="\uFEFF";
      const hdr="DATE;BENEFICIAIRE;NATURE;BANQUE;MOYEN;DEBIT;CREDIT;CODE;VERIFIE\n";
      const rows=toArchive.map(t=>[
        t.date,
        find(DB.beneficiaires,t.bId)?.nom||"",
        find(DB.natures,t.nId)?.l||"",
        find(DB.banques,t.bqId)?.nom||"",
        find(DB.moyens,t.mId)?.l||"",
        t.debit,t.credit,
        find(DB.codes,t.cId)?.code||"",
        t.ok?"oui":"non"
      ].join(";")).join("\n");
      dl(new Blob([bom+hdr+rows],{type:"text/csv;charset=utf-8;"}),
        `archive_${annee||"tout"}_${bqId?find(DB.banques,bqId)?.nom:"toutesbanques"}_${today()}.csv`);
      
      await new Promise(r=>setTimeout(r,500));
      
      // 2. Recalculate soldeInit for affected banks
      // Formula: newSoldeInit = currentSolde - sum(remaining transactions after deletion)
      // = (soldeInit + sum(allTx)) - sum(allTx - archivedTx)
      // = soldeInit + sum(archivedTx)  <- add back the archived transactions
      const archivedIds=new Set(toArchive.map(t=>t.id));
      const banquesAffectees=bqId?[find(DB.banques,+bqId)]:
        [...new Set(toArchive.map(t=>t.bqId))].map(id=>find(DB.banques,+id)).filter(Boolean);
      
      for(const b of banquesAffectees){
        if(!b)continue;
        // Current solde = soldeInit + ALL transactions for this bank
        const allTxBanque=DB.transactions.filter(t=>+t.bqId===+b.id);
        const currentSolde=(b.soldeInit||0)+allTxBanque.reduce((s,t)=>s+(+t.credit)-(+t.debit),0);
        // Remaining transactions after archive
        const remainingTx=allTxBanque.filter(t=>!archivedIds.has(t.id));
        const remainingSum=remainingTx.reduce((s,t)=>s+(+t.credit)-(+t.debit),0);
        // New soldeInit = currentSolde - remainingSum (so total stays the same)
        const newSoldeInit=currentSolde-remainingSum;
        console.log(`Archive: Bank ${b.nom} soldeInit ${b.soldeInit} -> ${newSoldeInit} (currentSolde=${currentSolde})`);
        await supa('PATCH','banques',{solde_init:newSoldeInit},`id=eq.${b.id}`);
      }
      
      // 3. Delete from Supabase
      const ids=toArchive.map(t=>t.id).join(',');
      await supa('DELETE','transactions','',`id=in.(${ids})`);
      
      await loadDB();render();
      showToast(`✅ ${toArchive.length} transactions archivées et supprimées`);
    },
    "Archiver et supprimer","#ef4444"
  );
}

let _confirmCB=null;

  document.getElementById("confirm-sub").textContent=sub||"";

// ═══════════════════════════════════════════
// AUTHENTIFICATION
// ═══════════════════════════════════════════
let currentUser=null;
let authMode="login";

function switchAuthTab(mode){
  authMode=mode;
  document.querySelectorAll(".auth-tab").forEach((t,i)=>{
    t.classList.toggle("active",(i===0&&mode==="login")||(i===1&&mode==="signup"));
  });
  document.getElementById("auth-btn").textContent=mode==="login"?"Se connecter":"Créer le compte";
  document.getElementById("auth-pwd2-wrap").style.display=mode==="signup"?"block":"none";
  document.getElementById("auth-err").style.display="none";
}

function showAuthError(msg){
  const el=document.getElementById("auth-err");
  el.textContent=msg;el.style.display="block";
}

async function authSubmit(){
  const email=(document.getElementById("auth-email").value||"").trim();
  const pwd=document.getElementById("auth-pwd").value||"";
  if(!email||!pwd){showAuthError("Email et mot de passe requis");return;}
  const btn=document.getElementById("auth-btn");
  btn.textContent="⏳ Connexion…";btn.disabled=true;
  document.getElementById("auth-err").style.display="none";
  try{
    if(authMode==="signup"){
      const pwd2=document.getElementById("auth-pwd2").value||"";
      if(pwd!==pwd2){showAuthError("Les mots de passe ne correspondent pas");btn.textContent="Créer le compte";btn.disabled=false;return;}
      if(pwd.length<6){showAuthError("Mot de passe trop court (6 caractères minimum)");btn.textContent="Créer le compte";btn.disabled=false;return;}
      const r=await fetch(`${SUPA_URL}/auth/v1/signup`,{method:'POST',headers:{'apikey':SUPA_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password:pwd})});
      const d=await r.json();
      if(d.error){showAuthError(d.error.message||d.error);btn.textContent="Créer le compte";btn.disabled=false;return;}
      showAuthError("✅ Compte créé ! Vérifiez votre email puis connectez-vous.");
      btn.textContent="Créer le compte";btn.disabled=false;
      switchAuthTab("login");
    }else{
      const r=await fetch(`${SUPA_URL}/auth/v1/token?grant_type=password`,{method:'POST',headers:{'apikey':SUPA_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password:pwd})});
      const d=await r.json();
      if(d.error||!d.access_token){showAuthError(d.error_description||d.error||"Identifiants incorrects");btn.textContent="Se connecter";btn.disabled=false;return;}
      // Store session
      currentUser={token:d.access_token,refresh:d.refresh_token,email:d.user.email,id:d.user.id};
      sessionStorage.setItem('mf_session',JSON.stringify(currentUser));
      onAuthSuccess();
    }
  }catch(e){showAuthError("Erreur réseau: "+e.message);btn.textContent=authMode==="login"?"Se connecter":"Créer le compte";btn.disabled=false;}
}

async function authReset(){
  const email=(document.getElementById("auth-email").value||"").trim();
  if(!email){showAuthError("Entrez votre email d'abord");return;}
  try{
    await fetch(`${SUPA_URL}/auth/v1/recover`,{method:'POST',headers:{'apikey':SUPA_KEY,'Content-Type':'application/json'},body:JSON.stringify({email})});
    showAuthError("✅ Email de réinitialisation envoyé !");
  }catch(e){showAuthError("Erreur: "+e.message);}
}

function authLogout(){
  currentUser=null;
  _loadingPromise=null;
  sessionStorage.removeItem('mf_session');
  DB={banques:[],beneficiaires:[],natures:[],moyens:[],codes:[],transactions:[],budgets:{},recurrents:[],appTitle:"💰 Mes Finances"};
  const safe=(id,fn)=>{const el=document.getElementById(id);if(el)fn(el);};
  safe("auth-screen",el=>el.style.display="flex");
  safe("header",el=>el.style.display="none");
  safe("user-bar",el=>el.style.display="none");
  safe("tabs",el=>el.style.display="none");
  safe("content",el=>el.innerHTML="");
  safe("auth-email",el=>el.value="");
  safe("auth-pwd",el=>el.value="");
  safe("auth-btn",el=>{el.textContent="Se connecter";el.disabled=false;});
  switchAuthTab("login");
}

function onAuthSuccess(){
  const safe=(id,fn)=>{const el=document.getElementById(id);if(el)fn(el);};
  safe("auth-screen",el=>el.style.display="none");
  safe("header",el=>el.style.display="block");
  safe("user-bar",el=>el.style.display="flex");
  safe("tabs",el=>el.style.display="flex");
  safe("user-email-display",el=>el.textContent="👤 "+currentUser.email);
  currentTab="dashboard";
  document.querySelectorAll(".tab-btn").forEach(b=>{
    b.classList.toggle("active", b.dataset.tab==="dashboard");
  });
  loadDB().then(()=>{
    if(DB&&DB.transactions){
      render();
      showToast("Connecté ✅");
    }
  }).catch(e=>{
    console.error("onAuthSuccess loadDB error:",e);
  });
}

// ═══════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════
async function init(){
  const hide=id=>{const el=document.getElementById(id);if(el)el.style.display="none";};
  const show=(id,d)=>{const el=document.getElementById(id);if(el)el.style.display=d||"block";};
  hide("header"); hide("user-bar"); hide("tabs");
  try{
    const saved=sessionStorage.getItem('mf_session');
    if(saved){
      currentUser=JSON.parse(saved);
      const r=await fetch(`${SUPA_URL}/auth/v1/user`,{
        headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+currentUser.token}
      });
      if(r.ok){onAuthSuccess();return;}
      else{
        currentUser=null;
        sessionStorage.removeItem('mf_session');
      }
    }
  }catch(e){console.error("Init error:",e);}
  show("auth-screen","flex");
}
init();
</script>
